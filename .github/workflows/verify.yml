name: Verify PoseTracker V4 + HoloLab + HoloDesk V5

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Gesture engines, HoloDesk, HoloLab, AirMouse and bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gesture behavior unit tests
        run: node --test tests/*.test.mjs
      - name: JavaScript module syntax
        run: node --input-type=module --check < app.js
      - name: HoloLab module syntax
        run: |
          node --input-type=module --check < holo.js
          node --input-type=module --check < holo-scene.mjs
          node --input-type=module --check < holo-gestures.mjs
      - name: HoloDesk V5 JavaScript syntax
        run: |
          node --input-type=module --check < desk.js
          node --input-type=module --check < desk-engine.mjs
      - name: Python bridge syntax
        run: python -m py_compile desktop_bridge.py
      - name: Local bridge HTTP behavior and fail-safe tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  browser-smoke:
    name: HoloDesk visual and interaction smoke test
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run HoloDesk browser interaction tests
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 > /tmp/holodesk-http.log 2>&1 &
          sleep 2
          node tests/desk.browser.mjs
      - name: Upload HoloDesk screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holodesk-v5-browser-preview
          path: artifacts/holodesk-v5-desktop.png
          if-no-files-found: ignore
