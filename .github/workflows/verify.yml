name: Verify PoseTracker V4

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Gesture engine, app and bridge checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gesture behavior unit tests
        run: node --test tests/engine.test.mjs
      - name: JavaScript module syntax
        run: node --input-type=module --check < app.js
      - name: Python bridge syntax
        run: python -m py_compile desktop_bridge.py
      - name: Local bridge HTTP behavior and fail-safe tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
